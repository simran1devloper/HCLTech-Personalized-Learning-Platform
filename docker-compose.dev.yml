# Local development infrastructure for the agentic content platform (PostgreSQL + Redis).
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down        # add -v to also delete data
# Credentials below are for LOCAL DEVELOPMENT ONLY. Never reuse them anywhere else.
name: learnai-dev

services:
  postgres:
    image: pgvector/pgvector:pg16        # PostgreSQL 16 with the pgvector extension (used for embeddings later)
    container_name: learnai-dev-postgres
    environment:
      POSTGRES_USER: learnai
      POSTGRES_PASSWORD: learnai_dev_only
      POSTGRES_DB: learnai
    ports:
      - "127.0.0.1:5433:5432"            # 5433 avoids clashing with a local PostgreSQL on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnai -d learnai"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: learnai-dev-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]   # cache/queue only; content lives in PostgreSQL
    ports:
      - "127.0.0.1:6380:6379"            # 6380 avoids clashing with a local Redis on 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
